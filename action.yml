name: "Allure Report Official"
description: "Bring seamless Allure Report 3 integration to your GitHub pipelines"
author: "Allure Team"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  report-directory:
    description: "The report directory to scan for files"
    required: false
    default: "./allure-report"
  remote-href:
    description: "Base URL where the published Allure report is hosted (e.g. GitHub Pages). Used to render `View` links in the summary table."
    required: false
    default: ""
  github-token:
    description: "GitHub token for creating checks and comments"
    required: false
    default: "${{ github.token }}"
  pr-number:
    description: "Pull request number to comment on when the workflow is not triggered by pull_request, such as issue_comment, workflow_dispatch, or workflow_run. pull_request event payload data takes precedence when available."
    required: false
    default: ""
  head-sha:
    description: "Commit SHA to use for GitHub checks when pr-number is used on a non-pull_request event."
    required: false
    default: ""
  sections:
    description: "Optional collapsible section comments to publish alongside the summary table. Supported values: `new`, `flaky`, `retry`, or `all`. Accepts comma- or newline-separated values."
    required: false
    default: ""
  debug:
    description: "Print additional diagnostic information"
    required: false
    default: "false"

runs:
  using: "node24"
  main: "dist/index.js"
