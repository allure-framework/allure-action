name: Release
run-name: Release ${{ inputs.releaseVersion }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      majorReleaseVersion:
        description: "Related major release version (e.g., v1)"
        required: true
        type: choice
        options:
          - v0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Release
    permissions:
      contents: write
    env:
      GIT_COMMIT_AUTHOR_EMAIL: ${{ vars.ALLURE_CI_APP_USER_ID }}+${{ vars.ALLURE_CI_APP_SLUG }}[bot]@users.noreply.github.com
      GIT_COMMIT_AUTHOR_NAME: ${{ vars.ALLURE_CI_APP_SLUG }}[bot]
    steps:
      - name: "Check release version"
        run: |
          expr "${{ github.event.inputs.releaseVersion }}" : '^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\(-beta\.[0-9][0-9]*\)\{0,1\}\)$'

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ALLURE_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALLURE_CI_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: "Configure CI Git User"
        run: |
          git config --global user.name "${GIT_COMMIT_AUTHOR_NAME}"
          git config --global user.email "${GIT_COMMIT_AUTHOR_EMAIL}"

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      - name: Build TypeScript
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: "Commit release version and create tag"
        run: |
          git add -A
          git commit --allow-empty -m "release ${{ github.event.inputs.releaseVersion }}" --no-verify
          git tag ${{ github.event.inputs.releaseVersion }}
          git push origin HEAD:main
          git push origin ${{ github.event.inputs.releaseVersion }}

      - name: "Publish Github Release"
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/${{ github.repository }}/releases
          tag_name: ${{ github.event.inputs.releaseVersion }}
          generate_release_notes: true
          target_commitish: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Tag new target
        run: git tag -f ${{ github.event.inputs.majorReleaseVersion }} ${{ github.event.inputs.releaseVersion }}

      - name: Push new tag
        run: git push origin ${{ github.event.inputs.majorReleaseVersion }} --force
