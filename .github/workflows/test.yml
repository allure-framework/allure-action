name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  checks: write
  contents: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Unit tests
    env:
      ALLURE_SERVICE_ACCESS_TOKEN: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute publish subpath
        id: path
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "subdir=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "subdir=" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      - name: Lint and format check
        run: yarn lint

      - name: Build TypeScript
        run: yarn build

      - name: Run tests
        run: |
          rm -rf ./out/allure-results
          ALLURE_PREVIEW_DUMP=1 yarn allure run --environment=chrome-ubuntu --dump=./out/allure-results-chrome-ubuntu -- yarn run test:unit
        continue-on-error: true

      - name: Add Firefox environment preview
        if: always()
        run: |
          rm -rf ./out/allure-results
          ALLURE_PREVIEW_DUMP=1 yarn allure run --environment=firefox-windows --dump=./out/allure-results-firefox-windows -- yarn run test:unit test/spec/action.test.ts -t "should handle quality gate in per-environment record format"
        continue-on-error: true

      - name: Add Safari environment preview
        if: always()
        run: |
          rm -rf ./out/allure-results
          ALLURE_PREVIEW_DUMP=1 yarn allure run --environment=safari-macos --dump=./out/allure-results-safari-macos -- yarn run test:unit test/spec/utils.test.ts -t "should render generation environments once above the table and per-summary resolution counters"
        continue-on-error: true

      - name: Build report
        if: always()
        run: yarn allure generate --dump=./out/allure-results-chrome-ubuntu.zip --dump=./out/allure-results-firefox-windows.zip --dump=./out/allure-results-safari-macos.zip
        continue-on-error: true

      - name: Build quality gate notification preview
        if: always()
        run: yarn report:quality-gate-preview
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          publish_dir: ./out/allure-report
          publish_branch: gh-pages
          destination_dir: ${{ steps.path.outputs.subdir }}
          keep_files: true

      - name: Run Allure Action
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./
        with:
          report-directory: "./out/allure-report"
          remote-href: "https://allure-framework.github.io/allure-action/${{ steps.path.outputs.subdir }}"
          debug: "true"

      - name: Keep quality gate preview non-blocking
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const { data } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref,
              check_name: "Allure Quality Gate",
            });
            const [checkRun] = data.check_runs
              .filter(({ conclusion }) => conclusion === "failure")
              .sort((left, right) => new Date(right.completed_at ?? 0) - new Date(left.completed_at ?? 0));

            if (!checkRun) {
              return;
            }

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: checkRun.id,
              status: "completed",
              conclusion: "neutral",
              output: {
                title: "Quality Gate Preview",
                summary:
                  "The quality gate notification preview was rendered in the pull request comment. This demo check is neutral so the preview fixture does not fail the pull request.",
              },
            });
