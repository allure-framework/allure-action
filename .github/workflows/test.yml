name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Quality checks
    env:
      ALLURE_SERVICE_ACCESS_TOKEN: ${{ secrets.ALLURE_SERVICE_ACCESS_TOKEN }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
      ALLURE_LAUNCH_TAGS: "${{ secrets.ALLURE_LAUNCH_TAGS }}, ${{ github.event_name }}"
      ALLURE_REAL_TESTS_ENVIRONMENT: "chrome-ubuntu"
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      - name: Lint and format check
        run: yarn lint

      - name: Check committed dist/
        id: check-dist
        run: yarn ci:check-dist

      - name: Run real unit tests
        env:
          ALLURE_SERVICE_ACCESS_TOKEN: ""
          ALLURE_TOKEN: ""
          ALLURE_ENDPOINT: ""
          ALLURE_PROJECT_ID: ""
        run: |
          rm -rf ./out/allure-results
          ALLURE_PREVIEW_DUMP=1 yarn allure run --environment="$ALLURE_REAL_TESTS_ENVIRONMENT" --dump=./out/allure-results-chrome-ubuntu -- yarn run test:unit
        continue-on-error: true

      - name: Add Firefox demo environment
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' }}
        env:
          ALLURE_SERVICE_ACCESS_TOKEN: ""
          ALLURE_TOKEN: ""
          ALLURE_ENDPOINT: ""
          ALLURE_PROJECT_ID: ""
        run: |
          rm -rf ./out/allure-results
          ALLURE_PREVIEW_DUMP=1 yarn allure run --environment=firefox-windows --dump=./out/allure-results-firefox-windows -- yarn run test:unit test/spec/action.test.ts -t "should handle quality gate in per-environment record format"
        continue-on-error: true

      - name: Add Safari demo environment
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' }}
        env:
          ALLURE_SERVICE_ACCESS_TOKEN: ""
          ALLURE_TOKEN: ""
          ALLURE_ENDPOINT: ""
          ALLURE_PROJECT_ID: ""
        run: |
          rm -rf ./out/allure-results
          ALLURE_PREVIEW_DUMP=1 yarn allure run --environment=safari-macos --dump=./out/allure-results-safari-macos -- yarn run test:unit test/spec/utils.test.ts -t "should render generation environments once above the table and per-summary resolution counters"
        continue-on-error: true

      - name: Verify preview dumps
        id: preview-dumps
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' }}
        run: |
          for dump in \
            ./out/allure-results-chrome-ubuntu.zip \
            ./out/allure-results-firefox-windows.zip \
            ./out/allure-results-safari-macos.zip
          do
            if [ ! -s "$dump" ]; then
              echo "::error::Expected preview dump was not created: $dump"
              exit 1
            fi
          done

      - name: Publish real tests to Allure Service and TestOps
        id: real-report
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' && steps.preview-dumps.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: ALLURE_REAL_REPORT=1 yarn allure generate --dump=./out/allure-results-chrome-ubuntu.zip --output=./out/allure-real-report

      - name: Build and publish demo reports
        id: report
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' && steps.preview-dumps.outcome == 'success' }}
        run: ALLURE_PREVIEW_REPORT_VARIANTS=1 yarn allure generate --dump=./out/allure-results-chrome-ubuntu.zip --dump=./out/allure-results-firefox-windows.zip --dump=./out/allure-results-safari-macos.zip

      - name: Build demo quality gate notification
        id: quality-gate-preview
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' && steps.report.outcome == 'success' }}
        run: yarn report:quality-gate-preview

      - name: Verify demo report notification
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' && steps.report.outcome == 'success' && steps.quality-gate-preview.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import fg from "fast-glob";
          import { readFile } from "node:fs/promises";

          const summaries = await fg(["./out/allure-report/**/summary.json"], { onlyFiles: true });

          if (summaries.length !== 5) {
            throw new Error(`Expected 5 preview summaries, found ${summaries.length}`);
          }

          const artifacts = JSON.parse(await readFile("./out/allure-report/artifacts.json", "utf-8"));

          if (!Array.isArray(artifacts) || artifacts.length !== 4) {
            throw new Error(`Expected 4 preview artifacts, found ${Array.isArray(artifacts) ? artifacts.length : "unknown"}`);
          }
          NODE

      - name: Add real report links to notification
        id: notification-reports
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' && steps.real-report.outcome == 'success' && steps.report.outcome == 'success' && steps.quality-gate-preview.outcome == 'success' }}
        run: |
          for plugin in awesome1 testops
          do
            source="./out/allure-real-report/$plugin/summary.json"
            destination="./out/allure-report/real/$plugin"

            if [ ! -s "$source" ]; then
              echo "::error::Expected published real report summary was not created: $source"
              exit 1
            fi

            mkdir -p "$destination"
            cp "$source" "$destination/summary.json"
          done

          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          for (const plugin of ["awesome1", "testops"]) {
            const summaryFile = `./out/allure-report/real/${plugin}/summary.json`;
            const summary = JSON.parse(await readFile(summaryFile, "utf-8"));

            if (typeof summary.remoteHref !== "string" || !summary.remoteHref) {
              throw new Error(`Expected published real report URL in ${summaryFile}`);
            }
          }
          NODE

      - name: Run Allure Action against published reports
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' && steps.notification-reports.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./
        with:
          report-directory: "./out/allure-report"
          github-token: ${{ github.token }}
          debug: "true"

      - name: Keep quality gate preview non-blocking
        if: ${{ !cancelled() && steps.check-dist.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const { data } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref,
              check_name: "Allure Quality Gate",
            });
            const [checkRun] = data.check_runs
              .filter(({ conclusion }) => conclusion === "failure")
              .sort((left, right) => new Date(right.completed_at ?? 0) - new Date(left.completed_at ?? 0));

            if (!checkRun) {
              return;
            }

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: checkRun.id,
              status: "completed",
              conclusion: "neutral",
              output: {
                title: "Quality Gate Preview",
                summary:
                  "The quality gate notification preview was rendered in the pull request comment. This demo check is neutral so the preview fixture does not fail the pull request.",
              },
            });
